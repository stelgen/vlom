name: Release screenshot

# Отдельный шаг после каждого релиза (канон reverseray):
# собрать APK → поднять Android TV 9 (API 28) эмулятор → поставить → запустить → скрин → приложить к Release.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  screenshot:
    name: Screenshot on Android TV 9 emulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Emulator + screencap
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          script: |
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/*.apk
            # назначить VLOM HOME и запустить старт-скрин
            adb shell cmd package set-home-activity com.stelgen.vlom/.MainActivity || true
            adb shell am start -n com.stelgen.vlom/.MainActivity
            sleep 5
            adb exec-out screencap -p > vlom-screenshot.png
            adb logcat -d > vlom-logcat.txt

      - name: Attach screenshot to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            vlom-screenshot.png vlom-logcat.txt --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-screenshot
          path: |
            vlom-screenshot.png
            vlom-logcat.txt
