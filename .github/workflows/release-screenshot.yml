name: Release screenshot

# После каждого релиза: собрать APK → эмулятор Android TV 9 (API 28) → установить →
# запустить → серия скриншотов → приложить к Release и закоммитить в docs/screenshot.png
# (README подхватывает автоматически).
#
# ⚠️ Release, созданный workflow'ом через GITHUB_TOKEN, НЕ триггерит release:published
# (ограничение GitHub) — поэтому основной триггер: workflow_run от Release.

# ⏸️ Автотриггеры отключены: эмулятор на GH-раннере нестабилен (отладка отложена).
# Запуск вручную: Actions -> Release screenshot -> Run workflow (tag=vX.Y.Z).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0); empty = latest release'
        required: false

permissions:
  contents: write

jobs:
  screenshot:
    name: Screenshot on Android TV 9 emulator
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -n "$TAG" ] || TAG="${{ github.event.workflow_run.head_branch }}"
          [ -n "$TAG" ] || TAG="${{ github.event.inputs.tag }}"
          case "$TAG" in v*) ;; *) TAG=$(gh api repos/${{ github.repository }}/releases/latest -q .tag_name);; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Emulator + screencap
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          script: |
            adb install -r app/build/outputs/apk/debug/*.apk || true
            adb shell svc power stayon true || true
            adb shell settings put system screen_off_timeout 600000 || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell cmd package set-home-activity com.stelgen.vlom/.MainActivity || true
            adb shell am start -W -n com.stelgen.vlom/.MainActivity || true
            sleep 12
            for i in 1 2 3 4; do
              adb exec-out screencap -p > shot$i.png || true
              sleep 3
              adb shell input keyevent KEYCODE_DPAD_RIGHT || true
            done
            adb logcat -d > vlom-logcat.txt || true
            adb shell dumpsys window > vlom-dumpsys-window.txt || true
            adb shell dumpsys power > vlom-dumpsys-power.txt || true
            true

      - name: Pick best shot
        run: |
          python3 -c "
          import os, shutil
          shots = [(os.path.getsize(f'shot{i}.png'), f'shot{i}.png') for i in (1,2,3,4) if os.path.exists(f'shot{i}.png')]
          shots.sort(reverse=True)
          size, best = shots[0]
          print(f'shot sizes: {shots}; chosen {best}')
          shutil.copy(best, 'vlom-screenshot.png')
          if size < 30000:
              print('WARNING: suspiciously small PNG (likely solid/black frame)')
          "

      - name: Update README screenshot in repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs
          cp vlom-screenshot.png docs/screenshot.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshot.png
          if git diff --cached --quiet; then
            echo "screenshot unchanged"
          else
            git commit -m "docs: update home screenshot (release ${{ steps.tag.outputs.tag }})"
            git push origin HEAD:main
          fi

      - name: Attach screenshot to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            vlom-screenshot.png vlom-logcat.txt \
            vlom-dumpsys-window.txt vlom-dumpsys-power.txt --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-screenshot
          path: |
            vlom-screenshot.png
            vlom-logcat.txt
            vlom-dumpsys-window.txt
            vlom-dumpsys-power.txt
            vlom-dumpsys-window.txt
            vlom-dumpsys-power.txt
