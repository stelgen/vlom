name: Release screenshot

# Отдельный шаг после каждого релиза (канон reverseray):
# собрать APK → поднять Android TV 9 (API 28) эмулятор → поставить → запустить → скрин → приложить к Release
# и закоммитить в docs/screenshot.png (README подхватывает автоматически).
#
# ⚠️ Release, созданный workflow'ом через GITHUB_TOKEN, НЕ триггерит release:published
# (известное ограничение GitHub) — поэтому основной триггер: workflow_run от Release.

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0); empty = latest release'
        required: false

permissions:
  contents: write

jobs:
  screenshot:
    name: Screenshot on Android TV 9 emulator
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -n "$TAG" ] || TAG="${{ github.event.workflow_run.head_branch }}"
          [ -n "$TAG" ] || TAG="${{ github.event.inputs.tag }}"
          case "$TAG" in v*) ;; *) TAG=$(gh api repos/${{ github.repository }}/releases/latest -q .tag_name);; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Emulator + screencap
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          script: |
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/*.apk
            # назначить VLOM HOME и запустить старт-скрин
            adb shell cmd package set-home-activity com.stelgen.vlom/.MainActivity || true
            adb shell am start -n com.stelgen.vlom/.MainActivity
            sleep 5
            adb exec-out screencap -p > vlom-screenshot.png
            adb logcat -d > vlom-logcat.txt

      - name: Update README screenshot in repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs
          cp vlom-screenshot.png docs/screenshot.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshot.png
          if git diff --cached --quiet; then
            echo "screenshot unchanged"
          else
            git commit -m "docs: update home screenshot (release ${GITHUB_REF_NAME})"
            git push origin HEAD:main
          fi

      - name: Attach screenshot to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            vlom-screenshot.png vlom-logcat.txt --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-screenshot
          path: |
            vlom-screenshot.png
            vlom-logcat.txt
